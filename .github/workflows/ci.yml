name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        # Rule selection lives in ruff.toml so it cannot drift when ruff
        # ships new defaults - which is exactly what turned CI red.
        run: ruff check backend/
      - name: Test
        run: pytest backend/tests -q
        env:
          GROQ_API_KEY: test-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No lint/typecheck step: this is a plain JS Vite app with no eslint
      # config and no tsconfig. `npm run lint` and `npx tsc --noEmit` both
      # failed here for exactly that reason -- they were carried over from the
      # deleted Next.js app. `npm test` runs src/data.test.mjs.
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        # Dockerfile at the repo root is the one Hugging Face Spaces builds; it
        # has to be in CI or the deployed image is the only untested one.
        file: [Dockerfile, deployment/Dockerfile.backend, deployment/Dockerfile.frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Local full stack.  Run from the repo root:
#   docker compose -f deployment/docker-compose.yml up --build

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    ports: ["8000:8000"]
    env_file: ../.env
    environment:
      HELIOOPS_LOG_LEVEL: INFO
      HELIOOPS_LOG_FORMAT: json
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        # vite inlines import.meta.env at build time, so this must be a build
        # arg, not a runtime environment variable. NEXT_PUBLIC_API_URL was the
        # Next-era name and nothing has read it since the SPA rewrite.
        VITE_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
